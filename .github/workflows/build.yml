name: Karten bauen

# Monthly: build all German states from the current Geofabrik extracts and publish them as a release.
# The TempoWarner app reads releases/latest/download/index.json and downloads/updates regions itself.
on:
  schedule:
    - cron: "0 2 3 * *"  # 3rd of every month, 02:00 UTC
  workflow_dispatch:
  push:  # Also after changes to the build (e.g. the first upload)
    branches: [main]
    paths: [build_region.py, make_index.py, requirements.txt, .github/workflows/build.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # Geofabrik paths below europe/ (DACH: German states, Austria, Switzerland)
        region: [germany/baden-wuerttemberg, germany/bayern, germany/berlin, germany/brandenburg, germany/bremen,
                 germany/hamburg, germany/hessen, germany/mecklenburg-vorpommern, germany/niedersachsen,
                 germany/nordrhein-westfalen, germany/rheinland-pfalz, germany/saarland, germany/sachsen,
                 germany/sachsen-anhalt, germany/schleswig-holstein, germany/thueringen, austria, switzerland]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build_region.py --region europe/${{ matrix.region }}
      - id: n
        run: echo "name=$(basename ${{ matrix.region }})" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.n.outputs.name }}
          path: regions/${{ steps.n.outputs.name }}.sqlite
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: regions
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="karten-$(date -u +%Y-%m-%d)"
          python make_index.py "$TAG" regions > regions/index.json
          gh release create "$TAG" regions/*.sqlite regions/index.json --latest \
            --title "Karten $(date -u +%d.%m.%Y)" \
            --notes "Deutschland (alle Bundesländer), Österreich, Schweiz, gebaut aus Geofabrik-Auszügen. Kartendaten © OpenStreetMap-Mitwirkende, ODbL."
          # Keep the last 3 releases
          gh release list --limit 100 --json tagName --jq '.[3:][].tagName' | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag
          done
